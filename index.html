<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Zero-Cost - Juxta Services</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #e9ecef;
            --primary-color: #2b2d42;
            --button-color: #2a9d8f;
            --button-hover: #21867a;
            --ticket-bg: #fff;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .ui-container {
            background-color: var(--ticket-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }
        h2 { text-align: center; margin-bottom: 25px; font-size: 1.6rem; color: #1d3557; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
        input {
            width: 100%; padding: 12px; border: 2px solid #dee2e6;
            border-radius: 6px; box-sizing: border-box; font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--button-color); outline: none; }
        button {
            width: 100%; padding: 14px; background-color: var(--button-color);
            color: white; border: none; border-radius: 6px; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; transition: background-color 0.3s;
            margin-top: 15px; box-shadow: 0 4px 6px rgba(42, 157, 143, 0.2);
        }
        button:hover { background-color: var(--button-hover); transform: translateY(-1px); }
        .nota { font-size: 0.8rem; color: #6c757d; text-align: center; margin-top: 20px; font-weight: bold;}

        /* --- INGENIERÍA DEL TICKET VISUAL (FORMATO 58mm ESTRECHO) --- */
        #ticket-render-zone {
            position: absolute;
            left: -9999px; 
            top: 0;
        }
        #ticket-visual {
            font-family: 'Courier New', Courier, monospace;
            background-color: white;
            color: black;
            width: 280px; /* Reducción a formato térmico angosto (58mm) */
            padding: 15px;
            box-sizing: border-box;
            font-size: 13px; /* Fuente ligeramente más ajustada */
            line-height: 1.3;
        }
        .t-center { text-align: center; }
        .t-bold { font-weight: bold; }
        .t-dashed { border-bottom: 1px dashed #000; margin: 8px 0; }
        .t-row { display: flex; justify-content: space-between; }
        .t-title { font-size: 16px; letter-spacing: 0.5px; }
        
        /* --- GROWTH HACKING: PROMOCIÓN JUXTA SERVICES --- */
        .juxta-promo {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #000;
            font-family: 'Segoe UI', system-ui, sans-serif; /* Contraste limpio frente al monospace */
            font-size: 10px;
            text-align: center;
            color: #333;
            line-height: 1.4;
        }
        .juxta-promo strong { color: #000; }
    </style>
</head>
<body>

    <div class="ui-container">
        <h2>Generador POS</h2>
        
        <div class="form-group">
            <label for="cliente">Cliente (Opcional):</label>
            <input type="text" id="cliente" placeholder="Ej. Juan Pérez">
        </div>
        
        <div class="form-group">
            <label for="identificacion">Cédula / NIT (Opcional):</label>
            <input type="text" id="identificacion" placeholder="Ej. 123456789">
        </div>
        
        <div class="form-group">
            <label for="producto">Producto Vendido:</label>
            <input type="text" id="producto" placeholder="Ej. Medio Pollo" required>
        </div>
        
        <div class="form-group">
            <label for="valor">Valor Total a Cobrar ($):</label>
            <input type="number" id="valor" placeholder="Ej. 35000" required>
        </div>
        
        <button id="btnGenerar" onclick="procesarTicket()">Generar e Imprimir Recibo</button>
        <p class="nota">Desarrollado por Juxta Services</p>
    </div>

    <div id="ticket-render-zone">
        <div id="ticket-visual">
            <div class="t-center t-bold t-title" id="t-empresa-nombre">NOMBRE EMPRESA</div>
            <div class="t-center">NIT: <span id="t-empresa-nit">000000</span></div>
            <div class="t-center" id="t-empresa-dir">Dirección</div>
            <div class="t-center">TICKET DE VENTA</div>
            <div class="t-dashed"></div>
            
            <div><span class="t-bold">FECHA: </span><span id="t-fecha"></span></div>
            <div><span class="t-bold">NRO: </span>#<span id="t-nro"></span></div>
            <div><span class="t-bold">CLIENTE: </span><span id="t-cliente"></span></div>
            <div><span class="t-bold">ID: </span><span id="t-id"></span></div>
            
            <div class="t-dashed"></div>
            <div class="t-row t-bold">
                <span>CONCEPTO</span>
                <span>TOTAL</span>
            </div>
            <div class="t-dashed"></div>
            
            <div class="t-row">
                <span style="max-width: 150px; word-wrap: break-word;">1x <span id="t-producto"></span></span>
                <span id="t-valor"></span>
            </div>
            
            <div class="t-dashed"></div>
            <div class="t-row t-bold" style="font-size: 15px;">
                <span>TOTAL:</span>
                <span id="t-total"></span>
            </div>
            <div class="t-dashed"></div>
            
            <div class="t-center">¡Gracias por su compra!</div>
            <div class="t-center" style="margin-top: 5px;">*** COPIA CLIENTE ***</div>
            
            <div class="juxta-promo">
                ¿Buscas tecnología para tu negocio?<br>
                Soluciones de software por <strong>Juxta Services</strong>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN ESTÁTICA DEL NEGOCIO
        const CONFIG_NEGOCIO = {
            nombre: "POLLOS EL BUEN SABOR",
            nit: "900.123.456-7",
            direccion: "Calle Principal #12-34"
        };

        const formatearMoneda = (valor) => {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency', currency: 'COP', minimumFractionDigits: 0
            }).format(valor);
        };

        const obtenerFechaActual = () => {
            const ahora = new Date();
            const dia = String(ahora.getDate()).padStart(2, '0');
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            return `${dia}/${mes}/${ahora.getFullYear()} ${horas}:${minutos}`;
        };

        async function procesarTicket() {
            const btn = document.getElementById('btnGenerar');
            const valorInput = document.getElementById('valor').value;
            const productoInput = document.getElementById('producto').value.trim();
            
            if (!valorInput || !productoInput) {
                alert('Por favor, ingresa el producto y el valor.');
                return;
            }

            btn.innerText = "Procesando...";
            btn.disabled = true;

            try {
                const cliente = document.getElementById('cliente').value.trim() || 'CONSUMIDOR FINAL';
                const identificacion = document.getElementById('identificacion').value.trim() || '222222222222';
                const valorFormat = formatearMoneda(valorInput);
                const ticketNro = Math.floor(Math.random() * 100000).toString().padStart(5, '0');

                document.getElementById('t-empresa-nombre').innerText = CONFIG_NEGOCIO.nombre;
                document.getElementById('t-empresa-nit').innerText = CONFIG_NEGOCIO.nit;
                document.getElementById('t-empresa-dir').innerText = CONFIG_NEGOCIO.direccion;
                
                document.getElementById('t-fecha').innerText = obtenerFechaActual();
                document.getElementById('t-nro').innerText = ticketNro;
                document.getElementById('t-cliente').innerText = cliente.toUpperCase();
                document.getElementById('t-id').innerText = identificacion;
                
                // Truncado más agresivo para el ticket angosto
                let prodCorto = productoInput.length > 18 ? productoInput.substring(0, 18) + "..." : productoInput;
                document.getElementById('t-producto').innerText = prodCorto.toUpperCase();
                document.getElementById('t-valor').innerText = valorFormat;
                document.getElementById('t-total').innerText = valorFormat;

                const ticketElement = document.getElementById('ticket-visual');
                const canvas = await html2canvas(ticketElement, {
                    scale: 2,
                    backgroundColor: "#ffffff"
                });

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], `Ticket_${ticketNro}.png`, { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'Ticket de Venta',
                                text: 'Adjunto su recibo de compra en ' + CONFIG_NEGOCIO.nombre
                            });
                        } catch (error) {
                            console.log('El usuario canceló.', error);
                        }
                    } else {
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.download = `Ticket_${ticketNro}.png`;
                        link.href = url;
                        link.click();
                        URL.revokeObjectURL(url);
                        
                        setTimeout(() => {
                            const msj = encodeURIComponent(`Hola ${cliente}, gracias por tu compra en ${CONFIG_NEGOCIO.nombre}. Tu recibo se ha descargado, por favor adjúntalo aquí para tener el soporte.`);
                            window.open(`https://wa.me/?text=${msj}`, '_blank');
                        }, 500);
                    }

                    document.getElementById('cliente').value = '';
                    document.getElementById('identificacion').value = '';
                    document.getElementById('producto').value = '';
                    document.getElementById('valor').value = '';
                    btn.innerText = "Generar e Imprimir Recibo";
                    btn.disabled = false;

                }, 'image/png');

            } catch (error) {
                console.error("Error en renderizado:", error);
                alert("Hubo un error al generar el ticket.");
                btn.innerText = "Generar e Imprimir Recibo";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
